name: Publish blog

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      BASE_PATH: ${{ vars.BASE_PATH }}
    steps:
      - uses: actions/checkout@v7
      - name: Require a public website URL
        run: node -e "const url = new URL(process.env.SITE_URL); if (url.protocol !== 'https:' || ['localhost', '127.0.0.1'].includes(url.hostname)) process.exit(1);"
      - uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm test && npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    steps:
      - id: release
        uses: actions/deploy-pages@v5
